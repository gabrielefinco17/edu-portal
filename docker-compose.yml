services:
  db:
    build: ./database
    container_name: captive_db
    restart: always
    environment:
      POSTGRES_USER: principal
      POSTGRES_PASSWORD: praga
      POSTGRES_DB: captive_portal_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U principal -d captive_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: captive_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: captive_frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  db_data:
